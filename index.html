<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Feed log</title>

<!-- ==========================================================
     SETTINGS — this is the only part of the file you edit.
     Paste your two Supabase values between the quote marks.
     Leave them empty and the page runs in demo mode.
     ========================================================== -->
<script>
  window.CAT_CONFIG = {
    catName: "",                  // e.g. "Mia" — shown in the heading
    people: ["Luisa", "Matt", "Other"],
    supabaseUrl: "",              // https://xxxxxxxx.supabase.co
    supabaseAnonKey: ""           // publishable key: sb_publishable_...
  };
</script>
<!-- ===== end of settings — nothing below needs changing ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF2EE;
    --card:#FFFFFF;
    --ink:#16211E;
    --muted:#6C7A74;
    --line:#D8DFD9;
    --wet:#1F6B5B;
    --wet-soft:#DCEBE5;
    --snack:#A9761A;
    --snack-soft:#F4E8CE;
    --danger:#9B3232;
    --radius:14px;
    --shadow:0 1px 2px rgba(22,33,30,.05), 0 8px 24px -16px rgba(22,33,30,.25);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:580px;margin:0 auto;padding:28px 18px 72px}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

  /* ---------- masthead ---------- */
  .eyebrow{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:0 0 6px
  }
  h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.02em;margin:0 0 14px
  }
  .status{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:14px}
  .status b{font-weight:600}
  .status .detail{color:var(--muted)}

  /* ---------- signature: the day ribbon ---------- */
  .ribbon{margin:0 0 26px}
  .ribbon-track{
    position:relative;height:34px;border-bottom:1px solid var(--line);
  }
  .ribbon-hour{
    position:absolute;bottom:0;width:1px;height:6px;background:var(--line);
  }
  .ribbon-now{position:absolute;bottom:0;width:1px;height:34px;background:var(--ink);opacity:.22}
  .pip{
    position:absolute;bottom:6px;width:9px;height:9px;border-radius:50%;
    transform:translateX(-50%);border:1.5px solid var(--card);
  }
  .pip.wet{background:var(--wet)}
  .pip.snack{background:var(--snack)}
  .ribbon-scale{
    display:flex;justify-content:space-between;margin-top:5px;
    font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:.05em
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px
  }
  .field{margin-bottom:16px}
  .field:last-of-type{margin-bottom:0}
  label.lbl{
    display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:7px
  }

  /* segmented control */
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .seg button{
    background:transparent;border:1px solid var(--line);border-radius:10px;
    padding:11px 8px;font-weight:500;transition:background .14s,border-color .14s,color .14s
  }
  .seg button:hover{border-color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .seg.type button[aria-pressed="true"][data-v="wet"]{background:var(--wet);border-color:var(--wet)}
  .seg.type button[aria-pressed="true"][data-v="snack"]{background:var(--snack);border-color:var(--snack)}

  .amount-row{display:flex;gap:8px;align-items:stretch}
  input[type="text"],input[type="number"],input[type="date"],input[type="datetime-local"],select{
    width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;appearance:none
  }
  input[type="number"]{font-family:"IBM Plex Mono",monospace;font-weight:500}
  .suffix{
    display:flex;align-items:center;padding:0 13px;border:1px solid var(--line);border-radius:10px;
    background:#F7F9F7;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:13px
  }
  .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .chip{
    background:#F4F7F4;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)
  }
  .chip:hover{color:var(--ink);border-color:var(--muted)}

  .primary{
    width:100%;margin-top:18px;background:var(--ink);color:#fff;border:1px solid var(--ink);
    border-radius:11px;padding:14px;font-weight:600;letter-spacing:.01em;
    transition:transform .1s ease, opacity .14s
  }
  .primary:active{transform:scale(.99)}
  .primary[disabled]{opacity:.5;cursor:default}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:0}

  /* ---------- history ---------- */
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:34px 0 12px
  }
  .section-head h2{
    font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em
  }
  .count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}

  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .filters .full{grid-column:1/-1}
  .filters select,.filters input{background:#fff;font-size:14px;padding:10px 11px}
  .filters .selwrap{position:relative}
  .filters .selwrap::after{
    content:"";position:absolute;right:12px;top:50%;width:6px;height:6px;
    border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
    transform:translateY(-70%) rotate(45deg);pointer-events:none
  }
  .clear{
    background:none;border:none;padding:6px 0;color:var(--muted);font-size:13px;
    text-decoration:underline;text-underline-offset:3px
  }

  .daygroup{margin-top:22px}
  .daylabel{
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);padding-bottom:7px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between
  }
  .entry{border-bottom:1px solid var(--line)}
  .entry-row{
    width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
    background:none;border:none;padding:13px 2px;text-align:left
  }
  .entry-row:hover{background:#F7F9F7}
  .time{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
  .who{font-weight:500}
  .what{font-size:13px;color:var(--muted);margin-top:1px}
  .tag{
    font-family:"IBM Plex Mono",monospace;font-size:12px;padding:4px 9px;border-radius:999px;white-space:nowrap
  }
  .tag.wet{background:var(--wet-soft);color:var(--wet)}
  .tag.snack{background:var(--snack-soft);color:var(--snack)}
  .fresh{animation:flash 1.4s ease-out}
  @keyframes flash{from{background:var(--wet-soft)}to{background:transparent}}

  .editor{padding:4px 2px 18px}
  .editor .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .editor .actions{display:flex;gap:8px;margin-top:14px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:500}
  .btn.save{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.del{margin-left:auto;color:var(--danger);border-color:#E7CFCF}
  .btn.del.armed{background:var(--danger);border-color:var(--danger);color:#fff}

  .empty{
    text-align:center;color:var(--muted);padding:34px 10px;font-size:14px;
    border:1px dashed var(--line);border-radius:var(--radius);margin-top:14px
  }
  .banner{
    font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;margin-bottom:18px;line-height:1.4
  }
  .banner b{color:var(--ink);font-weight:600}
  @media (max-width:400px){ h1{font-size:29px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow" id="eyebrow">Shared feeding record</p>
  <h1 id="title">Feed log</h1>

  <p class="status" id="status"></p>

  <!-- signature element: today at a glance -->
  <div class="ribbon">
    <div class="ribbon-track" id="track"></div>
    <div class="ribbon-scale"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
  </div>

  <div class="banner" id="demoBanner" hidden>
    <b>Demo mode.</b> Entries live in this browser tab only. Add your Supabase URL and anon key at the top of this file to make it shared and permanent.
  </div>

  <!-- ENTRY -->
  <div class="card">
    <div class="field">
      <label class="lbl">Who is feeding</label>
      <div class="seg" id="segPerson"></div>
    </div>

    <div class="field">
      <label class="lbl">What</label>
      <div class="seg type" id="segType">
        <button type="button" data-v="wet" aria-pressed="true">Wet food</button>
        <button type="button" data-v="snack" aria-pressed="false">Snack</button>
      </div>
    </div>

    <div class="field" id="amountField">
      <label class="lbl" id="amountLabel" for="amount">Amount</label>
      <div class="amount-row">
        <input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="45" />
        <div class="suffix" id="suffix">g</div>
      </div>
      <div class="chips" id="chips">
        <button class="chip" type="button" data-g="30">30 g</button>
        <button class="chip" type="button" data-g="45">45 g</button>
      </div>
      <input id="note" type="text" placeholder="Two dental sticks" hidden />
    </div>

    <button class="primary" id="submit">Log feeding</button>
    <div class="err" id="formErr"></div>
  </div>

  <!-- HISTORY -->
  <div class="section-head">
    <h2>Earlier feedings</h2>
    <span class="count" id="count"></span>
  </div>

  <div class="filters">
    <div class="full"><input id="fQ" type="text" placeholder="Search snacks, notes, anything" /></div>
    <div class="selwrap"><select id="fPerson"><option value="">Anyone</option></select></div>
    <div class="selwrap"><select id="fType">
      <option value="">Any food</option>
      <option value="wet">Wet food</option>
      <option value="snack">Snack</option>
    </select></div>
    <div class="full"><input id="fDate" type="date" /></div>
  </div>
  <button class="clear" id="clearFilters" hidden>Clear filters</button>

  <div id="list"></div>
</div>

<script type="module">
/* Settings live in the SETTINGS block at the very top of this file. */
const CONFIG = window.CAT_CONFIG;

/* ---------- data layer ---------- */
const useSupabase = Boolean(CONFIG.supabaseUrl && CONFIG.supabaseAnonKey);
let db;

if (useSupabase) {
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const sb = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);
  const T = "feedings";
  db = {
    async list() {
      const { data, error } = await sb.from(T).select("*").order("fed_at", { ascending: false }).limit(500);
      if (error) throw error;
      return data;
    },
    async create(r) {
      const { data, error } = await sb.from(T).insert(r).select().single();
      if (error) throw error;
      return data;
    },
    async update(id, patch) {
      const { error } = await sb.from(T).update(patch).eq("id", id);
      if (error) throw error;
    },
    async remove(id) {
      const { error } = await sb.from(T).delete().eq("id", id);
      if (error) throw error;
    }
  };
} else {
  const h = (hoursAgo) => new Date(Date.now() - hoursAgo * 3600e3).toISOString();
  let rows = [
    { id: "1", fed_at: h(2.4),  person: "Luisa", food_type: "wet",   grams: 45,  note: null },
    { id: "2", fed_at: h(6.1),  person: "Matt",  food_type: "snack", grams: null, note: "Two dental sticks" },
    { id: "3", fed_at: h(9.5),  person: "Matt",  food_type: "wet",   grams: 30,  note: null },
    { id: "4", fed_at: h(26),   person: "Luisa", food_type: "wet",   grams: 45,  note: null },
    { id: "5", fed_at: h(31),   person: "Other", food_type: "snack", grams: null, note: "Cat sitter gave chicken" },
    { id: "6", fed_at: h(50),   person: "Luisa", food_type: "wet",   grams: 30,  note: null }
  ];
  db = {
    async list() { return [...rows].sort((a, b) => b.fed_at.localeCompare(a.fed_at)); },
    async create(r) { const row = { ...r, id: crypto.randomUUID() }; rows.push(row); return row; },
    async update(id, patch) { rows = rows.map(r => r.id === id ? { ...r, ...patch } : r); },
    async remove(id) { rows = rows.filter(r => r.id !== id); }
  };
  document.getElementById("demoBanner").hidden = false;
}

/* ---------- state ---------- */
let entries = [];
let person = null;
let foodType = "wet";
let editingId = null;
let armedDeleteId = null;
let freshId = null;
const filters = { q: "", person: "", type: "", date: "" };

const $ = (id) => document.getElementById(id);

if (CONFIG.catName) {
  $("title").textContent = CONFIG.catName + "'s feed log";
  $("eyebrow").textContent = "Shared feeding record";
}

/* ---------- helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const timeOf = (iso) => { const d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dayKey = (iso) => { const d = new Date(iso); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };

function dayLabel(key) {
  const today = dayKey(new Date().toISOString());
  const yest = dayKey(new Date(Date.now() - 864e5).toISOString());
  if (key === today) return "Today";
  if (key === yest) return "Yesterday";
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
}

function ago(iso) {
  const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (mins < 1) return "just now";
  if (mins < 60) return mins + " min ago";
  const hrs = Math.floor(mins / 60), rem = mins % 60;
  if (hrs < 24) return hrs + "h " + rem + "m ago";
  const days = Math.floor(hrs / 24);
  return days === 1 ? "yesterday" : days + " days ago";
}

const describe = (e) => e.food_type === "wet" ? e.grams + " g wet food" : (e.note || "snack");

function toLocalInput(iso) {
  const d = new Date(iso);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}

/* ---------- entry form ---------- */
const segPerson = $("segPerson");
CONFIG.people.forEach(p => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = p; b.dataset.v = p; b.setAttribute("aria-pressed", "false");
  b.onclick = () => { person = p; paintPerson(); $("formErr").textContent = ""; };
  segPerson.appendChild(b);
  const opt = document.createElement("option"); opt.value = p; opt.textContent = p;
  $("fPerson").appendChild(opt);
});
const paintPerson = () => [...segPerson.children].forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === person)));

$("segType").onclick = (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  foodType = b.dataset.v;
  [...$("segType").children].forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === foodType)));
  const wet = foodType === "wet";
  $("amountLabel").textContent = wet ? "Amount" : "What was it";
  $("amount").hidden = !wet; $("suffix").hidden = !wet; $("chips").hidden = !wet;
  $("note").hidden = wet;
  $("formErr").textContent = "";
};

$("chips").onclick = (ev) => {
  const c = ev.target.closest(".chip"); if (!c) return;
  $("amount").value = c.dataset.g;
};

$("submit").onclick = async () => {
  const err = $("formErr");
  if (!person) { err.textContent = "Pick who is feeding."; return; }
  const rec = { person, food_type: foodType, fed_at: new Date().toISOString(), grams: null, note: null };
  if (foodType === "wet") {
    const g = parseInt($("amount").value, 10);
    if (!g || g <= 0) { err.textContent = "Enter the amount in grams."; return; }
    rec.grams = g;
  } else {
    const n = $("note").value.trim();
    if (!n) { err.textContent = "Describe the snack in a few words."; return; }
    rec.note = n;
  }
  err.textContent = "";
  $("submit").disabled = true;
  try {
    const row = await db.create(rec);
    freshId = row.id;
    $("amount").value = ""; $("note").value = "";
    await load();
    setTimeout(() => { freshId = null; }, 1600);
  } catch (e) {
    err.textContent = "Could not save that. Check the connection and try again.";
  } finally {
    $("submit").disabled = false;
  }
};

/* ---------- filters ---------- */
["fQ", "fPerson", "fType", "fDate"].forEach(id => {
  $(id).addEventListener("input", () => {
    filters.q = $("fQ").value.trim().toLowerCase();
    filters.person = $("fPerson").value;
    filters.type = $("fType").value;
    filters.date = $("fDate").value;
    render();
  });
});
$("clearFilters").onclick = () => {
  $("fQ").value = ""; $("fPerson").value = ""; $("fType").value = ""; $("fDate").value = "";
  filters.q = filters.person = filters.type = filters.date = "";
  render();
};

const matches = (e) => {
  if (filters.person && e.person !== filters.person) return false;
  if (filters.type && e.food_type !== filters.type) return false;
  if (filters.date && dayKey(e.fed_at) !== filters.date) return false;
  if (filters.q) {
    const hay = [e.person, e.food_type === "wet" ? "wet food" : "snack", e.note || "", e.grams ? e.grams + " g" : ""].join(" ").toLowerCase();
    if (!hay.includes(filters.q)) return false;
  }
  return true;
};

/* ---------- render ---------- */
function renderStatus() {
  const last = entries[0];
  $("status").innerHTML = last
    ? `<b>Last fed ${ago(last.fed_at)}</b> <span class="detail">— ${describe(last)}, by ${last.person}</span>`
    : `<span class="detail">No feedings recorded yet.</span>`;

  const track = $("track");
  track.innerHTML = "";
  [6, 12, 18].forEach(h => {
    const t = document.createElement("div");
    t.className = "ribbon-hour"; t.style.left = (h / 24 * 100) + "%";
    track.appendChild(t);
  });
  const now = new Date();
  const nowLine = document.createElement("div");
  nowLine.className = "ribbon-now";
  nowLine.style.left = ((now.getHours() * 60 + now.getMinutes()) / 1440 * 100) + "%";
  track.appendChild(nowLine);

  const today = dayKey(now.toISOString());
  entries.filter(e => dayKey(e.fed_at) === today).forEach(e => {
    const d = new Date(e.fed_at);
    const pip = document.createElement("div");
    pip.className = "pip " + e.food_type;
    pip.style.left = ((d.getHours() * 60 + d.getMinutes()) / 1440 * 100) + "%";
    pip.title = timeOf(e.fed_at) + " · " + describe(e) + " · " + e.person;
    track.appendChild(pip);
  });
}

function render() {
  renderStatus();
  const shown = entries.filter(matches);
  const active = filters.q || filters.person || filters.type || filters.date;
  $("clearFilters").hidden = !active;
  $("count").textContent = active
    ? shown.length + " of " + entries.length
    : entries.length + (entries.length === 1 ? " entry" : " entries");

  const list = $("list");
  list.innerHTML = "";

  if (!shown.length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = active ? "Nothing matches those filters." : "No feedings logged yet. The first one goes above.";
    list.appendChild(p);
    return;
  }

  const groups = new Map();
  shown.forEach(e => {
    const k = dayKey(e.fed_at);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  });

  groups.forEach((rows, key) => {
    const g = document.createElement("div");
    g.className = "daygroup";
    const total = rows.filter(r => r.food_type === "wet").reduce((s, r) => s + (r.grams || 0), 0);
    const head = document.createElement("div");
    head.className = "daylabel";
    head.innerHTML = `<span>${dayLabel(key)}</span><span>${total ? total + " g" : ""}</span>`;
    g.appendChild(head);
    rows.forEach(e => g.appendChild(entryEl(e)));
    list.appendChild(g);
  });
}

function entryEl(e) {
  const wrap = document.createElement("div");
  wrap.className = "entry";

  const row = document.createElement("button");
  row.className = "entry-row" + (e.id === freshId ? " fresh" : "");
  row.setAttribute("aria-expanded", String(editingId === e.id));
  row.innerHTML = `
    <span class="time">${timeOf(e.fed_at)}</span>
    <span>
      <span class="who">${esc(e.person)}</span>
      <span class="what">${esc(e.food_type === "wet" ? e.grams + " g wet food" : (e.note || "Snack"))}</span>
    </span>
    <span class="tag ${e.food_type}">${e.food_type === "wet" ? "wet" : "snack"}</span>`;
  row.querySelector(".what").style.display = "block";
  row.onclick = () => { editingId = editingId === e.id ? null : e.id; armedDeleteId = null; render(); };
  wrap.appendChild(row);

  if (editingId === e.id) wrap.appendChild(editorEl(e));
  return wrap;
}

function editorEl(e) {
  const ed = document.createElement("div");
  ed.className = "editor";
  const isWet = e.food_type === "wet";
  ed.innerHTML = `
    <div class="row" style="margin-bottom:8px">
      <div class="selwrap"><select data-f="person">${CONFIG.people.map(p => `<option ${p === e.person ? "selected" : ""}>${esc(p)}</option>`).join("")}</select></div>
      <div class="selwrap"><select data-f="type">
        <option value="wet" ${isWet ? "selected" : ""}>Wet food</option>
        <option value="snack" ${!isWet ? "selected" : ""}>Snack</option>
      </select></div>
    </div>
    <div style="margin-bottom:8px">
      <input data-f="grams" type="number" min="1" placeholder="Grams" value="${isWet ? e.grams ?? "" : ""}" ${isWet ? "" : "hidden"} />
      <input data-f="note" type="text" placeholder="What was the snack" value="${isWet ? "" : esc(e.note || "")}" ${isWet ? "hidden" : ""} />
    </div>
    <input data-f="fed_at" type="datetime-local" value="${toLocalInput(e.fed_at)}" />
    <div class="actions">
      <button class="btn save">Save changes</button>
      <button class="btn cancel">Cancel</button>
      <button class="btn del">${armedDeleteId === e.id ? "Tap to confirm" : "Delete"}</button>
    </div>`;
  if (armedDeleteId === e.id) ed.querySelector(".del").classList.add("armed");

  const get = (f) => ed.querySelector(`[data-f="${f}"]`);
  get("type").onchange = () => {
    const wet = get("type").value === "wet";
    get("grams").hidden = !wet; get("note").hidden = wet;
  };
  ed.querySelector(".cancel").onclick = () => { editingId = null; armedDeleteId = null; render(); };
  ed.querySelector(".del").onclick = async () => {
    if (armedDeleteId !== e.id) { armedDeleteId = e.id; render(); return; }
    await db.remove(e.id); editingId = null; armedDeleteId = null; await load();
  };
  ed.querySelector(".save").onclick = async () => {
    const wet = get("type").value === "wet";
    const patch = {
      person: get("person").value,
      food_type: wet ? "wet" : "snack",
      grams: wet ? parseInt(get("grams").value, 10) || null : null,
      note: wet ? null : (get("note").value.trim() || null),
      fed_at: new Date(get("fed_at").value).toISOString()
    };
    if (wet && !patch.grams) return;
    if (!wet && !patch.note) return;
    await db.update(e.id, patch);
    editingId = null;
    await load();
  };
  return ed;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- boot ---------- */
async function load() {
  entries = await db.list();
  render();
}
await load();
setInterval(renderStatus, 60000);
</script>
</body>
</html>
